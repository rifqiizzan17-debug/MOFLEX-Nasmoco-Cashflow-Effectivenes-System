<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOFLEX | Secure Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0d1117;
            --surface: #161b22;
            --accent: #00FFFF; /* Cyan dari logo lu */
            --blue-deep: #0000FF;
            --text: #ffffff;
            --border: #30363d;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg);
            background-image: radial-gradient(circle at 50% 50%, #1a1f2e 0%, #0d1117 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: var(--text);
        }

        .login-card {
            background: var(--surface);
            padding: 50px 40px;
            border-radius: 20px;
            width: 100%;
            max-width: 380px;
            border: 1px solid var(--border);
            text-align: center;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
            backdrop-filter: blur(10px);
        }

        .logo-area img {
            width: 130px; /* Sesuaikan ukuran logo moflex lu */
            margin-bottom: 10px;
        }

        .logo-area h1 {
            font-size: 28px;
            margin: 0;
            letter-spacing: 2px;
            background: linear-gradient(90deg, var(--blue-deep), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
        }

        .tagline {
            font-size: 10px;
            color: #8b949e;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 40px;
        }

        .input-box {
            text-align: left;
            margin-bottom: 25px;
        }

        label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: #8b949e;
            margin-bottom: 8px;
            padding-left: 4px;
        }

        input {
            width: 100%;
            padding: 14px 16px;
            background: #0d1117;
            border: 1px solid var(--border);
            border-radius: 12px;
            color: white;
            font-size: 14px;
            box-sizing: border-box;
            transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.15);
        }

        button {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, var(--blue-deep), #0055ff);
            border: none;
            border-radius: 12px;
            color: white;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            transition: 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 10px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 0, 255, 0.3);
            background: linear-gradient(135deg, #0011ff, var(--accent));
        }

        #msg {
            margin-top: 20px;
            font-size: 13px;
            min-height: 20px;
            font-weight: 500;
        }

        .footer {
            margin-top: 40px;
            font-size: 10px;
            color: #484f58;
            border-top: 1px solid var(--border);
            padding-top: 20px;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="logo-area">
            <img src="moflex_zoom.png" alt="MOFLEX">
            <h1>MOFLEX</h1>
            <div class="tagline">Money Flow Excellence</div>
            <div class="tagline">by Rifqi Izzan ODP 2026</div>
        </div>

        <div class="input-box">
            <label>ID ANALYST</label>
            <input type="text" id="userField" placeholder="Enter your username" autocomplete="off">
        </div>

        <div class="input-box">
            <label>ACCESS KEY</label>
            <input type="password" id="passField" placeholder="Enter your access key">
        </div>

        <button onclick="doLogin()">Authorize System</button>
        
        <p id="msg"></p>

        <div class="footer">
            NASMOCO Cashflow Effectiveness | INTERNAL WEB TOOLS v5
        </div>
    </div>

    <script>
       function doLogin() {
            const u = document.getElementById('userField').value;
            const p = document.getElementById('passField').value;
            const m = document.getElementById('msg');

            // Daftar user lu taro di sini
            const users = {
                "rifqi-izzan": "reviewodp2026",
                "rangga": "nasmoco2026",
                "admin": "merdeka123",
                "iqbalxgawe": "odpbatch1",
            };

            // Logika simple: Cek apakah user ada di daftar & passwordnya cocok
            if (users[u] && users[u] === p) {
                m.style.color = "#3fb950";
                m.innerHTML = "Access Granted. Redirecting...";
                
                // Simpan siapa yang login (ini penting buat log nanti)
                localStorage.setItem("currentUser", u);

                setTimeout(() => {
                    // PASTIKAN NAMA FILE DI BAWAH INI SAMA DENGAN FILE DASHBOARD LU
                    window.location.href = "moflex gen1.html"; 
                }, 1000);
            } else {
                m.style.color = "#f85149";
                m.innerHTML = "Invalid Credentials. Access Denied.";
                
                // Efek getar
                document.querySelector('.login-card').style.animation = "shake 0.3s ease";
                setTimeout(() => {
                    document.querySelector('.login-card').style.animation = "";
                }, 300);
            }
        }
    </script>

    <style>
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            75% { transform: translateX(8px); }
        }
    </style>
</body>
</html>
